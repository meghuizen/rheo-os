# rheo-net Phase N1a (docs/NETSTACK.md): the L2/L3 core through the new `net`
# crate - an ARP round trip via net::eth/net::arp + IPv4/IPv6 build/parse/checksum.
[[bin]]
name = "netcore"
path = "src/netcore.rs"

# rheo-net Phase N1b (docs/NETSTACK.md): UDP + ICMP over SLIRP - a DNS query to
# 10.0.2.3:53 (UDP round trip) and a ping to the gateway 10.0.2.2 (ICMP echo),
# plus the UDP/ICMP checksum oracles.
[[bin]]
name = "netl4"
path = "src/netl4.rs"

# rheo-net Phase N1c (docs/NETSTACK.md): the caching DNS client - a compressed
# response parse oracle + pointer-loop safety, and deterministic hosts/blocklist/
# cache-hit checks (network-free, asserted via a query counter), plus a bonus
# live resolve over SLIRP's DNS (10.0.2.3).
[[bin]]
name = "netdns"
path = "src/netdns.rs"

# rheo-net Phase N1e (docs/NETSTACK.md): first-class TTL / IPv6 hop limit + the
# forwarding-plane decrement primitive + ICMP Time Exceeded (v4 + v6 codec) + the
# traceroute state machine fed synthetic responses (multi-hop discovery without
# real routers), plus a bonus live 1-hop trace to the gateway 10.0.2.2.
[[bin]]
name = "nettrace"
path = "src/nettrace.rs"

# rheo-net Phase N1d (docs/NETSTACK.md §10): the native local fast path
# (net::local) - two cells exchange a payload over librheo::ipc + a sealed grant,
# zero-copy, no IP stack, plus the datapath selector. Needs no netdev.
[[bin]]
name = "netlocal"
path = "src/netlocal.rs"

# rheo-net Phase N2a (docs/NETSTACK.md §11): the native TCP state machine + the
# timer wheel. Two TCP endpoints in one cell over a virtual link drive the full
# lifecycle deterministically (handshake, bidirectional data, drop/RTO recovery,
# teardown), plus the checksum/segment oracles and the timer-wheel multiplex over
# the single reactor slot. Needs no netdev - entirely in-cell.
[[bin]]
name = "nettcp"
path = "src/nettcp.rs"

# rheo-net Phase N2b (docs/NETSTACK.md §11): real TCP congestion control - Reno +
# CUBIC (net::cc) over the N2a seam. Deterministic integer cwnd trajectories (slow
# start, AIMD, fast retransmit/recovery, RTO, the CUBIC W(t) shape) pinned against
# oracles, plus a real Connection<Reno> fast-retransmit-before-RTO scenario over the
# in-cell virtual link. Needs no netdev - entirely in-cell.
[[bin]]
name = "nettcpcc"
path = "src/nettcpcc.rs"

# rheo-net Phase N2c (docs/NETSTACK.md §13): the two transports - the smoltcp
# blessed transport cell (a live smoltcp UDP DNS round trip to SLIRP 10.0.2.3:53
# over librheo::net + a deterministic in-cell smoltcp TCP/UDP over Loopback) and
# the native sharded transport (2 shards, connections hashed to shards, a
# cross-shard TCP transfer over the in-cell virtual link). Needs the SLIRP netdev.
[[bin]]
name = "netsmoltcp"
path = "src/netsmoltcp.rs"

# rheo-net Phase N3a (docs/NETSTACK.md §3): the crypto primitive layer - every
# primitive proven against its RFC/NIST test vector (ChaCha20-Poly1305, SHA-2,
# HKDF, X25519, Ed25519, AES-GCM) + round-trip/tamper checks + the
# two-randomness-class + nonce-safe API. Pure compute - needs no netdev.
[[bin]]
name = "netcrypto"
path = "src/netcrypto.rs"

# rheo-net N3b (docs/NETSTACK.md §15): TLS 1.3 - the RFC 8448 §3 known-answer key
# schedule (byte-for-byte), an in-cell full 1-RTT handshake (both suites) with an
# app-data round trip + tamper-reject, and a minimal-X.509 verify/reject. Pure
# compute - needs no netdev.
[[bin]]
name = "nettls"
path = "src/nettls.rs"

# Linux-personality L8 (docs/LINUX-COMPAT.md L8): AF_UNIX sockets - an unmodified
# static-glibc C fixture doing socketpair+fork and bind/listen/connect/accept.
[[bin]]
name = "linuxunix"
path = "src/linuxunix.rs"

# Linux-personality L8-INET (docs/LINUX-COMPAT.md L8-INET): AF_INET/AF_INET6
# sockets over loopback - a static-glibc C fixture doing TCP+UDP+epoll over
# 127.0.0.1 and TCP over ::1.
[[bin]]
name = "linuxinet"
path = "src/linuxinet.rs"

[[bin]]
name = "smp"
path = "src/smp.rs"
required-features = ["smp"]

[[bin]]
name = "shell-smoke"
path = "src/shell_smoke.rs"

[[bin]]
name = "lsh"
path = "src/lsh.rs"
