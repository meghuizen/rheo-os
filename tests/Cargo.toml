[package]
name = "qemu-tests"
version = "0.1.0"
edition = "2024"

# In-QEMU test kernels (docs/DEVELOPMENT.md 9): each binary boots as a
# kernel, exercises one subsystem, and reports pass/fail through the QEMU
# exit device. Run with `cargo xtask test` / `cargo xtask bench`.

[dependencies]
kernel = { path = "../kernel" }
runtime = { path = "../runtime" }
posix = { path = "../posix" }

# rheo-net in its librheo-free **codec** posture (docs/NETSTACK.md N4b): the
# `linuxnet` kernel registers a `svc::SocketOps` bridge whose datapath is the
# stack's own eth/arp/ip/udp/tcp code, so a Linux cell can reach real remote
# addresses while the kernel itself stays network-stack-free and allocation-free.
# `default-features = false` drops librheo - it supplies a *cell's* `_start`,
# panic handler and global allocator, which a kernel binary cannot link.
# NOTE: never build `-p qemu-tests` together with `-p rheo-net` in one cargo
# invocation; feature unification would re-enable `hosted` and the link would
# fail. xtask keeps them in separate invocations.
rheo-net = { path = "../net", default-features = false }

[features]
# The `smp` test kernel needs kernel/smp (docs/SMP.md). Kept out of the default
# set + gated on the bin via required-features so the other 31 test kernels build
# a byte-identical `kernel` lib (SMP off); xtask builds the smp kernel in a
# separate cargo invocation with this feature on.
smp = ["kernel/smp"]

