[package]
name = "qemu-tests"
version = "0.1.0"
edition = "2024"

# In-QEMU test kernels (docs/DEVELOPMENT.md 9): each binary boots as a
# kernel, exercises one subsystem, and reports pass/fail through the QEMU
# exit device. Run with `cargo xtask test` / `cargo xtask bench`.

[dependencies]
kernel = { path = "../kernel" }
runtime = { path = "../runtime" }
posix = { path = "../posix" }

[features]
# The `smp` test kernel needs kernel/smp (docs/SMP.md). Kept out of the default
# set + gated on the bin via required-features so the other 31 test kernels build
# a byte-identical `kernel` lib (SMP off); xtask builds the smp kernel in a
# separate cargo invocation with this feature on.
smp = ["kernel/smp"]

[[bin]]
name = "cap-invariants"
path = "src/cap_invariants.rs"

