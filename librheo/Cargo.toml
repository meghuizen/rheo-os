[package]
name = "librheo"
version = "0.1.0"
edition = "2024"

# librheo (docs/LIBRHEO.md): the greenfield native userspace foundation library
# for rheo-os - the role a libc plays, rebuilt for THIS kernel: async-first,
# capability-native, built ON `runtime/` (heap, strand executor, type-level
# rights). Unlike `libc/` (the C/POSIX compat layer) it does not chase an
# existing ABI; it expresses the kernel's own object model (queue pairs,
# capabilities, per-cell entropy). Phase A ships the spine: mem/rng/cap + the
# async queue reactor (rt). A program links it, gets `_start`/heap/allocator,
# and reaches the kernel through its cell's queue pair.

[dependencies]
runtime = { path = "../runtime" }

[lib]
name = "librheo"

[[bin]]
name = "librheo-demo"
path = "src/bin/librheo-demo.rs"

[[bin]]
name = "librheo-data"
path = "src/bin/librheo-data.rs"

[[bin]]
name = "librheo-compute"
path = "src/bin/librheo-compute.rs"
