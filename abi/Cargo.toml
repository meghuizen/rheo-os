[package]
name = "rheo-abi"
version = "0.1.0"
edition = "2024"

# The on-wire user/kernel ABI, written **once** (docs/ARCHITECTURE-DEBT.md 3.1).
#
# Before this crate existed the syscall numbers, the queue opcodes, the ring
# header and eleven `repr(C)` result blocks were hand-written twice - once in
# `kernel/src/{abi,queue}.rs` and once in `librheo/src/sys.rs` - kept in step by
# comments saying "keep in sync". Geometry drift was caught (librheo asserts the
# version), but a field-meaning change within the same size, or a `SYS_`/`OP_`
# number moving on one side, produced wrong numbers with no fault: the exact
# failure mode the FP/SIMD switch bug already cost this tree. Both sides now
# re-export this crate, so divergence is a compile error.
#
# Follows the `runtime/` model, which is what let one library link into both a
# kernel binary and a cell with no feature gymnastics (docs/ARCHITECTURE-DEBT.md
# 3.4): `no_std`, **zero dependencies**, and **no lang items** - no
# `#[panic_handler]`, no `#[global_allocator]`, no `_start`. Nothing here
# allocates or panics; it is layout and numbers.

