[workspace]
resolver = "2"
members = ["abi", "json", "kernel", "libc", "librheo", "net", "posix", "runtime", "tests", "userland", "xtask"]
# Needs the custom rheo-os target + build-std (docs/USERLAND.md M4), so a plain
# host `cargo build` cannot compile it; kept out of the workspace build.
exclude = ["targets/std-rheo/hello", "targets/std-rheo/coreutils"]
# Plain `cargo build` only builds the host-side xtask tool.
# The kernel needs a bare-metal --target and is built via `cargo xtask build`.
default-members = ["xtask"]

# The kernel never unwinds; abort keeps the binary small and honest.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
