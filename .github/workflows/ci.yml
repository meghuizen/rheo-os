# CI per TOOLING.md 4 / DEVELOPMENT.md 9: on every commit, lint the code
# and boot a test kernel headless in QEMU on all three ISAs, gating on the
# QEMU exit code. Serial output is uploaded as a log artifact.
#
# QEMU runs track correctness; absolute performance numbers only gate on
# the hardware lab (from milestone M1).

name: CI

on:
  # **Every branch, not just `main`.** Restricting pushes to `main` meant a branch
  # with no open pull request got no CI at all, and that is not hypothetical: the
  # `gpuhw` boot test sat red on aarch64 and riscv64 across three commits on a
  # feature branch because nothing ever ran it. A boot regression is exactly what
  # this pipeline exists to catch, so it has to run where the work happens.
  push:
  pull_request:
  # Runnable on demand against any branch: without it the only way to exercise this
  # workflow is a push or an open pull request, so a fix to the workflow itself
  # cannot be tried before it is merged.
  workflow_dispatch:

# One run per branch. Now that pushes to every branch build, a branch with an open
# pull request receives both a `push` and a `pull_request` event for the same commit,
# which without this would start two identical runs of a 3-ISA boot matrix. The group
# key normalises the two event shapes to the same branch name - `head.ref` is `foo` on
# a pull_request, `ref_name` is `foo` on a push - so they collapse into one.
#
# Cancelling the older run is right for a feature branch, where only the tip matters,
# and wrong for `main`, where every commit that lands deserves a full run of its own
# rather than being superseded by the next merge - hence the condition rather than a
# bare `true`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# Least privilege: nothing here writes to the repository, and the default token
# permissions are broader than that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_STD_FLAGS: -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    # A hung build otherwise runs to GitHub's 6-hour default. This job builds
    # userspace for three ISAs and clippies the whole workspace; ~25 min is the
    # observed shape, so 60 is headroom rather than a target.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml (pinned nightly, components, targets)
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The Linux personality fixtures (docs/LINUX-COMPAT.md L2) are
      # static-glibc binaries for each ISA; clippy on qemu-tests `include_bytes!`s
      # them, so the cross gccs + `*-unknown-linux-gnu` targets are needed and
      # the fixtures must be built before clippy checks the test kernels.
      #
      # `libc6-dev-*-cross` must be named explicitly: it is a *Recommends* of the cross
      # gcc, so `--no-install-recommends` drops it, and it is what supplies `crt1.o`,
      # `crti.o`, `crtn.o` and `libc.a` for a static link (plus, via `libc6-*-cross`,
      # the `ld-linux-*.so` / `libc.so.6` / `libm.so.6` the L7 dynamic fixtures copy
      # out of the sysroot).
      #
      # The C++ set is for the four-library `dcpp` fixture. It is optional - xtask
      # writes a placeholder and `linuxdyn` skips that phase - but a silent skip means
      # CI covers less than a developer's machine, so it is installed rather than
      # left to degrade.
      - name: Install Linux cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            libc6-dev-arm64-cross libc6-dev-riscv64-cross \
            g++-aarch64-linux-gnu g++-riscv64-linux-gnu \
            libstdc++6-arm64-cross libstdc++6-riscv64-cross \
            libgcc-s1-arm64-cross libgcc-s1-riscv64-cross
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu riscv64gc-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The key carries the commit so every run SAVES an updated cache;
          # `restore-keys` then falls back to the newest cache for the same
          # toolchain+lockfile. With a key that changes only when `Cargo.lock`
          # does - the previous form - the cache is written once and never
          # refreshed, so it goes stale and each run rebuilds more of a tree this
          # size than it needs to.
          key: lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            lint-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --all --check

      # Every workspace crate that builds for the host. `xtask` was the only one
      # linted before, leaving `rheo-abi`, `rheo-json`, `posix`, `ext4fs` and
      # `runtime` with no coverage at all - and `runtime` is the crate whose
      # allocator every cell and test kernel binds.
      - name: clippy (host crates)
        run: |
          cargo clippy -p xtask -p rheo-abi -p rheo-json -p posix -p ext4fs -p runtime \
            --all-targets -- -D warnings

      # docs/SUBSTRATE.md 11 says Tier K - the kernel, the ABI, posix and xtask -
      # stays zero-dependency *permanently*. That rule was written down, referenced
      # in xtask's own source, and enforced by nothing: adding a crates.io
      # dependency to the kernel would have been an ordinary green build. It is
      # mechanical now.
      #
      # `cargo tree --prefix none` prints in-tree crates with a ` (/path)` suffix and
      # registry crates without one, so anything left after dropping path-suffixed
      # lines is an external dependency. Verified against a positive control:
      # `ext4fs`, which legitimately has 18, is detected.
      - name: Tier K stays zero-dependency (docs/SUBSTRATE.md 11)
        run: |
          fail=0
          for p in kernel rheo-abi posix xtask; do
            ext=$(cargo tree -p "$p" --edges normal --prefix none \
                  | tail -n +2 | sed 's/ (\*)$//' | grep -v '^[[:space:]]*$' \
                  | grep -v ' (/' | sort -u || true)
            if [ -n "$ext" ]; then
              echo "::error::$p is Tier K and must have no external dependencies, but has:"
              echo "$ext"
              fail=1
            fi
          done
          exit $fail

      # Host model-checking of the kernel state machines that are integer-only and
      # dependency-free (verify/README.md, docs/EXECUTION-MODEL.md 8). Seconds, no
      # QEMU, and it runs here rather than in the per-ISA matrix because it is not
      # per-ISA: it drives portable Rust on the host. It does not replace the boot
      # tests - it catches the class of defect that otherwise needs four cores and a
      # 120-second boot to surface.
      - name: verify (host state-machine model check)
        run: cargo xtask verify

      # Build fixtures/userspace for every ISA so every `include_bytes!` in the
      # test kernels resolves before clippy compiles them.
      - name: Build userspace + fixtures (all ISAs)
        run: cargo xtask build --arch all

      # Both feature postures, because `smp` is a separate compilation: five test
      # kernels (`smp`, `linuxsmp`, `linuxbunsmp`, `linuxnodesmp`, `linuxclaudesmp`)
      # have `required-features = ["smp"]`, so the default run does not build them and
      # was not linting them at all. That gap was hiding real lints in the tree's most
      # assertion-dense kernel.
      - name: clippy (kernel + test kernels, all ISAs, both feature postures)
        run: |
          for target in x86_64-unknown-none aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf; do
            cargo clippy -p kernel -p qemu-tests --target "$target" $BUILD_STD_FLAGS -- -D warnings
            cargo clippy -p kernel -p qemu-tests --features smp --target "$target" $BUILD_STD_FLAGS -- -D warnings
          done

      # The userspace half, which had no lint coverage either: `librheo`,
      # `rheo-libc`, `userland` and `rheo-net` are 4 of the 12 workspace crates and
      # they are what a cell actually runs. Linted on the **cell** target, because
      # that is what they ship as - librheo builds hard-float there and the bare
      # kernel target is soft-float, so the two are separate compilations with
      # different `target_feature` cfgs (docs/LIBRHEO.md "ifunc" has the case where
      # that difference is a compiler crash rather than a diagnostic).
      #
      # Two second postures are included for the same reason the kernel's `smp` one
      # is - a feature flag is a separate compilation, and an unlinted one is an
      # unlinted crate:
      #   - `librheo --no-default-features` is the embedded spine, and only
      #     `librheo-embed` is meant to link without `full`, so the bin is named.
      #   - `rheo-net --no-default-features` is the librheo-free **codec** posture
      #     that links beside a kernel binary for the N4b bridge, so it is linted on
      #     the kernel target rather than the cell one.
      #
      # `rheo-net`'s demo bins are deliberately `--lib` only: their feature sets
      # (`proof`, `smoltcp`, `crypto` plus soft-backend RUSTFLAGS) live in xtask, and
      # duplicating that matrix here would be a second copy to keep in step. The
      # library is where the code is.
      - name: clippy (cell crates, all ISAs, extra feature postures)
        run: |
          set -e
          for pair in \
            "targets/rheo_cell-x86_64.json x86_64-unknown-none" \
            "aarch64-unknown-none aarch64-unknown-none-softfloat" \
            "riscv64gc-unknown-none-elf riscv64gc-unknown-none-elf"; do
            set -- $pair; cell=$1; kern=$2
            cargo clippy -p librheo -p rheo-libc -p userland \
              --release --target "$cell" $BUILD_STD_FLAGS -Zjson-target-spec -- -D warnings
            cargo clippy -p rheo-net --lib \
              --release --target "$cell" $BUILD_STD_FLAGS -Zjson-target-spec -- -D warnings
            cargo clippy -p librheo --no-default-features --bin librheo-embed \
              --release --target "$cell" $BUILD_STD_FLAGS -Zjson-target-spec -- -D warnings
            cargo clippy -p rheo-net --lib --no-default-features \
              --release --target "$kern" $BUILD_STD_FLAGS -Zjson-target-spec -- -D warnings
          done

  boot-test:
    name: Boot test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    # 71 test kernels, each with its own 120 s in-QEMU timeout, plus the fixture
    # builds and the bench pass. Generous, but bounded - the point is that a wedged
    # QEMU fails the job instead of occupying a runner for six hours.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cross-pkgs` is the whole toolchain this arch's glibc fixtures need, not
          # just the compiler driver: see the lint job's note on why
          # `libc6-dev-*-cross` has to be named. x86-64 needs nothing - the runner's
          # own gcc, libc and libstdc++ are the fixture toolchain there.
          #
          # `seabios` must be named for arm/riscv and NOT for x86: it ships the
          # `vgabios-*.bin` blobs the legacy VGA models load at realize time, and it
          # is a *Depends* of `qemu-system-x86` but of neither `qemu-system-arm` nor
          # `qemu-system-misc`. Without it `-device ati-vga` (and bochs, and cirrus)
          # makes QEMU exit during startup with `failed to find romfile` and an empty
          # serial log, so `gpuhw` loses three of its four GPU vendors on those two
          # ISAs. xtask probes for the blobs and skips-with-reason, so a machine
          # without them still boots - this is what makes CI actually exercise them.
          - arch: x86_64
            qemu-package: qemu-system-x86
            gnu-target: x86_64-unknown-linux-gnu
            cross-pkgs: ""
          - arch: aarch64
            qemu-package: qemu-system-arm seabios
            gnu-target: aarch64-unknown-linux-gnu
            cross-pkgs: >-
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              g++-aarch64-linux-gnu libstdc++6-arm64-cross libgcc-s1-arm64-cross
          - arch: riscv64
            qemu-package: qemu-system-misc seabios
            gnu-target: riscv64gc-unknown-linux-gnu
            cross-pkgs: >-
              gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
              g++-riscv64-linux-gnu libstdc++6-riscv64-cross libgcc-s1-riscv64-cross
    steps:
      - uses: actions/checkout@v4

      # QEMU + the arch's static-glibc cross gcc (the host gcc covers x86_64);
      # the fixtures the linuxrun kernel embeds are built from source by
      # `cargo xtask test` (docs/LINUX-COMPAT.md L2).
      - name: Install QEMU and cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.qemu-package }} ${{ matrix.cross-pkgs }}

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add the Linux-gnu target for fixtures
        run: rustup target add ${{ matrix.gnu-target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # See the lint job's note: the commit in the key is what makes the cache
          # refresh instead of being written once and left to rot.
          key: boot-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            boot-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            boot-${{ matrix.arch }}-${{ runner.os }}-

      - name: Build and boot test kernels in QEMU
        run: cargo xtask test --arch ${{ matrix.arch }}

      # Instruction-path-length benchmarks under deterministic icount
      # (docs/TOOLING.md 4: QEMU tracks trends; wall-clock gates on the
      # hardware lab only). Numbers land in the uploaded logs and feed
      # comparison/RESULTS.md.
      - name: Benchmark (icount path lengths)
        run: cargo xtask bench --arch ${{ matrix.arch }}

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs-${{ matrix.arch }}
          path: target/qemu-${{ matrix.arch }}-*.log
          if-no-files-found: ignore
